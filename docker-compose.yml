services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nomad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
      POSTGRES_DB: nomad_league
    ports:
      - "5432:5432"
    volumes:
      - league_data:/var/lib/postgresql/data
volumes:
  league_data:
